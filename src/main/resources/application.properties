# Habilitar Swagger UI en modo prod y compilado nativo
quarkus.swagger-ui.always-include=true

#redis
quarkus.redis.hosts=redis://localhost:6379

# Deshabilita HTTP inseguro
quarkus.http.port=0
# Habilita HTTPS en 8083
quarkus.http.ssl-port=8083
# Escucha en todas las interfaces
quarkus.http.host=0.0.0.0


quarkus.http.ssl.certificate.key-store-file=C:/VSFESAAS_TEST/certificado_wss/keystore.p12
quarkus.http.ssl.certificate.key-store-password=MiPasswordSecreto
quarkus.http.ssl.certificate.key-store-file-type=PKCS12

