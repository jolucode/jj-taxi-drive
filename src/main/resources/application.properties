# Puerto por defecto para MongoDB local
quarkus.mongodb.connection-string = mongodb://localhost:27017

# Base de datos a usar (la crea si no existe)
quarkus.mongodb.database = jjtaxidriver


quarkus.swagger-ui.path=swaggerui
mp.openapi.extensions.smallrye.info.title=JJ TAXI DRIVE
%dev.mp.openapi.extensions.smallrye.info.title=JJ TAXI DRIVE (development)
%test.mp.openapi.extensions.smallrye.info.title=JJ TAXI DRIVE (test)
mp.openapi.extensions.smallrye.info.version=1.0.1
